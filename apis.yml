name: Purmeo
description: PURMEO GmbH is a German ("Made in Germany") manufacturer and direct-to-consumer retailer
  of high-quality nutritional supplements, vitamins, and minerals, with a focus on digestive health
  (including H. pylori support), energy, immunity, cognitive function, vision, bone and joint support,
  and cardiovascular health. Products are formulated without artificial additives, GMOs, or magnesium
  stearate and are distributed via the company's own online shop as well as Amazon, DocMorris, Medpex,
  and Shop-Apotheke. Surfaced as a portfolio company of point-nine and added to the API Evangelist
  network. As of the enrichment pass this is a B2C e-commerce business with no public API, developer
  portal, or developer documentation surface.
